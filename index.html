  <body>
    <!--
      DIRECTION CONTRACT — Lookahead

      THESIS: An instrument for reading ahead of the moment, not a flashcard app
      wearing a dark theme. Refuses the category default of rounded cards on
      slate with a neon accent.

      OWN-WORLD: A head-up display. Warm ivory symbology on instrument charcoal,
      drawn entirely in 1px stroke — corner registration marks and hairlines
      instead of panels, one caution amber, no glow and no shadow. The cube is
      the only saturated colour anywhere on screen.

      STORY: You already know every algorithm. What costs you time is the pause
      between finishing OLL and reading the PLL underneath it. Every rep is timed
      to the hundredth; the tapes show whether that pause is shrinking.

      FIRST VIEWPORT: Mode annunciator across the top. The cube centred inside a
      reticle, flanked by a latency tape left and a repertoire tape right. The
      21-case answer grid across the bottom, in fixed positions forever.

      FORM: Head-up display, candidate 7 of the grounded list; seed 5f8332fa.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
