<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Lookahead — train the seam between OLL and PLL. Predict the case before the algorithm finishes."
    />
    <title>Lookahead — OLL to PLL recognition</title>
    <!--
      Installed to a home screen, this runs with no browser chrome at all: the
      status bar sits over the interface, so the layout pads itself out of the
      way with env(safe-area-inset-*) rather than assuming a rectangle.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lookahead" />
    <!-- Dates and case numbers are not phone numbers. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFFFFF'/%3E%3Cg fill='none' stroke='%2314181B' stroke-width='1.6'%3E%3Cpath d='M6 6h6v6H6z'/%3E%3Cpath d='M6 20h6v6H6z'/%3E%3Cpath d='M20 6h6v6h-6z'/%3E%3Cpath d='M20 20h6v6h-6z'/%3E%3C/g%3E%3Cpath d='M16 13v6M13 16h6' stroke='%23B45309' stroke-width='1.6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Lookahead

      THESIS: An instrument for reading ahead of the moment, not a flashcard app
      wearing a dark theme.

      OWN-WORLD: White, quiet, soft-edged. Near-black on white, everything
      rounded, nothing bordered, type plain — no caps, no tracking. Regions are
      separated by space and given a barely-there tint only when they genuinely
      need to group; one burnt-amber accent, spent on the single control you
      press. No glow, no shadow. The cube is the only saturated colour anywhere
      on screen, the only dark mass, and the only hard-cornered thing in the app.

      STORY: You already know every algorithm. What costs you time is the pause
      between finishing OLL and reading the PLL underneath it. Every rep is timed
      to the hundredth; the tapes show whether that pause is shrinking.

      FIRST VIEWPORT: A row of mode tabs, then the cube with air around it, then
      a thin strip carrying the question and the one button that answers it.
      Nothing beside the cube, and no line anywhere on the screen.

      FORM: Began as a dark head-up display (candidate 7, seed 5f8332fa) and was
      quietened twice on request: the tapes, the reticle, the registration
      marks, the etched glass and the boresight are gone, the corners are round,
      and the ground is white.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
